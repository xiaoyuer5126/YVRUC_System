# 志愿服务管理平台 · Docker 全栈编排
#
#   cp .env.example .env && 填好口令                # 首次
#   cp caddy.env.example caddy.env && 填域名与令牌   # 首次（内网 https 入口）
#   docker compose up -d --build                    # 启动全套
#   docker compose --profile seed run --rm seed     # 重置演示数据
#   docker logs yvruc-caddy --tail 20               # 看证书签发情况
#   docker logs yvruc-cloudflared --tail 20         # 看隧道连接状态
#
# 服务拓扑（两个入口，都落到同一个 web 容器）：
#   caddy(80/443, TLS 终止) ──▶ web(nginx:80) ──/api──▶ backend(uvicorn:8000)
#   cloudflared(隧道, TLS 在 Cloudflare 边缘终止) ──▶ web(nginx:80) ──▶ 同上
#        └──▶ postgres + redis
#
# 网络用固定网段（见文件末尾 networks）：web 容器里的 nginx 要靠
# YVRUC_TRUSTED_PROXY_CIDR 把 X-Forwarded-For 还原成真实客户端 IP，
# 信任范围与网段必须一致；网段由 Docker 随机分配的话，这个值就没法提前写死。
# 换网段时两处一起改：这里是 172.30.0.0/16，.env 里是 172.30.0.0/16。
#
# 内网这条路：域名的 A 记录指向本机内网 IP，caddy 用 Let's Encrypt 的 DNS-01
# 挑战签证书（不需要 80/443 从公网可达，见 Caddyfile）。
# 公网这条路：Cloudflare 隧道，域名在 Zero Trust 控制台绑定。
#
# 数据库与 Redis 端口只绑 127.0.0.1：调试用得上，公网碰不到。
# 宿主机端口可在 .env 里改——同一台机器上别的项目也可能占着这些端口。
x-backend-build: &backend_build
  context: .
  dockerfile: backend/Dockerfile
  target: runtime
  args:
    PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}

x-backend-env: &backend_env
  YVRUC_DATABASE_URL: postgresql+psycopg://yvruc:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/yvruc
  YVRUC_REDIS_URL: redis://redis:6379/0
  YVRUC_DEMO_PASSWORD: ${YVRUC_DEMO_PASSWORD:-}
  YVRUC_BOOTSTRAP_ADMINS: ${YVRUC_BOOTSTRAP_ADMINS:-}
  YVRUC_EXPOSE_DOCS: ${YVRUC_EXPOSE_DOCS:-}
  YVRUC_PUBLIC_BASE_URL: ${YVRUC_PUBLIC_BASE_URL:-}
  YVRUC_SITE_URL: ${YVRUC_SITE_URL:-}
  YVRUC_ID_CARD_KEY: ${YVRUC_ID_CARD_KEY:?请在 .env 设置 YVRUC_ID_CARD_KEY（见 .env.example）}
  # 学校开放平台（能力开放平台 / 统一认证）。留空 = 相关能力回落 Mock。
  # tests 服务把这几个变量显式置空：测试永远跑在 Mock 下，碰不到真实接口。
  YVRUC_OPENPLATFORM_APPID: ${YVRUC_OPENPLATFORM_APPID:-}
  YVRUC_OPENPLATFORM_SECRET: ${YVRUC_OPENPLATFORM_SECRET:-}
  YVRUC_OPENPLATFORM_GATEWAY: ${YVRUC_OPENPLATFORM_GATEWAY:-}
  YVRUC_CAS_BASE_URL: ${YVRUC_CAS_BASE_URL:-}
  YVRUC_SSO_REDIRECT_URI: ${YVRUC_SSO_REDIRECT_URI:-}
  # 天地图（管理端画签到点用）。瓦片由后端转发，只用服务端 tk（瓦片 + 地名搜索，
  # 按服务器 IP 白名单校验），只在后端用、不进前端；没配则地图只画点和圈。
  # 注意这一份是逐个变量列出来的——往 .env 加了新变量，忘了在这儿加一行，
  # 容器里就当它不存在（表现为「地图不出来、也不报错」）。
  YVRUC_TIANDITU_TK_SERVER: ${YVRUC_TIANDITU_TK_SERVER:-}
  # 每个 tk 每天的瓦片额度，到上限后端直接 503、不再请求天地图
  YVRUC_TIANDITU_DAILY_LIMIT: ${YVRUC_TIANDITU_DAILY_LIMIT:-10000}
  # AI 起草（活动管理右下角的按钮）：OpenAI 兼容接口，key 留空则按钮不出现
  YVRUC_AI_BASE_URL: ${YVRUC_AI_BASE_URL:-}
  YVRUC_AI_MODEL: ${YVRUC_AI_MODEL:-}
  YVRUC_AI_API_KEY: ${YVRUC_AI_API_KEY:-}
  YVRUC_AI_TIMEOUT: ${YVRUC_AI_TIMEOUT:-}
  YVRUC_AI_THINKING: ${YVRUC_AI_THINKING:-}
  # 进程数与连接池。加进程是为了吃满多核（一个进程一个核，压测见
  # tests/perf_probe.py），但 Postgres 的连接是**按进程各开一个池**再相加的：
  # 进程数 ×(池子+溢出) 不能顶到 max_connections（默认 100），所以两个一起调。
  YVRUC_WORKERS: ${YVRUC_WORKERS:-4}
  YVRUC_DB_POOL_SIZE: ${YVRUC_DB_POOL_SIZE:-5}
  YVRUC_DB_MAX_OVERFLOW: ${YVRUC_DB_MAX_OVERFLOW:-10}
  # 场次锁在数据库里排队、各占一条连接：每进程最多放这么多个进去，
  # 要明显小于上面「池子+溢出」，否则抢报时读请求拿不到连接
  YVRUC_LOCK_SLOTS: ${YVRUC_LOCK_SLOTS:-5}
  YVRUC_THREADS: ${YVRUC_THREADS:-100}
  # 拿到名额闸门号的报名请求最多排多少秒场次锁（等不到回 503）
  YVRUC_TICKET_WAIT_SECONDS: ${YVRUC_TICKET_WAIT_SECONDS:-30}
  # 审批放着没人处理多少小时开始催（只催人，不自动通过）
  YVRUC_APPROVAL_REMIND_HOURS: ${YVRUC_APPROVAL_REMIND_HOURS:-24}
  # 设为 1 关掉后台定时任务（候补清扫、状态流转、提醒、日报）。生产别关
  YVRUC_DISABLE_SWEEPER: ${YVRUC_DISABLE_SWEEPER:-}
  TZ: Asia/Shanghai

services:
  postgres:
    image: postgres:16-alpine
    container_name: yvruc-postgres
    environment:
      POSTGRES_USER: yvruc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: yvruc
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - yvruc_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yvruc -d yvruc"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: yvruc-redis
    # 名额闸门与限流计数都是可重建的瞬时状态，不做持久化
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: *backend_build
    image: yvruc-backend:local
    container_name: yvruc-backend
    environment: *backend_env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"   # 本机直连 API 调试用，公网只走 web 反代
    volumes:
      - yvruc_uploads:/app/data/uploads   # 活动二维码等上传件持久化
      - yvruc_materials:/app/data/materials # 学习材料、立项书与反馈截图持久化
      # 天地图瓦片的磁盘缓存：重建容器不丢，免得重新花每天 10000 次的额度
      - yvruc_tiles:/app/data/tiles
      # 操作日志（JSON Lines 文件，见 backend/oplog.py）：和数据库、上传件分开放
      - yvruc_oplog:/app/data/oplog
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # web 的 depends_on 等的就是这个 healthy——没有它 nginx 会在后端还没起来时
      # 就开始转发，页面直接 502。所以探针留着，但起来之后没必要十秒一次地刷日志：
      # 启动期 2 秒一探（起得一样快），转成健康之后 30 秒一探。
      test: ["CMD", "python", "-c",
             "import urllib.request as u;u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 2s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: yvruc-web
    environment:
      # nginx 配置模板里的 set_real_ip_from：信任哪些来源的 X-Forwarded-For。
      # 默认值要与文件末尾 networks 的网段一致，改一处就得改两处。
      YVRUC_TRUSTED_PROXY_CIDR: ${YVRUC_TRUSTED_PROXY_CIDR:-172.30.0.0/16}
    # 对外的入口是 caddy（内网）和 cloudflared（公网），两者都在 compose 网络里按
    # 服务名访问 web:80。这里的映射只绑 127.0.0.1，局域网连不上，不构成绕过 TLS
    # 的入口；本机调试和 CI 的页面自检（scripts/viewcheck.mjs）走它。
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # 内网直连入口：域名的 A 记录指向本机，TLS 在这里终止，再明文转给 web。
  # 证书由 Let's Encrypt 经 DNS-01 自动签发与续期，见 Caddyfile。
  caddy:
    # 官方 caddy 镜像不含 DNS 插件（Caddyfile 里写 dns cloudflare 会报
    # unknown directive: dns），这个镜像就是官方版本加上 Cloudflare 插件。
    #
    # 用 latest：镜像作者负责把 Caddy 与插件编成能用的组合。注意它随重建
    # （up --force-recreate / pull 后重建 / 换机器重装）跟着作者的最新版本走，
    # 组合一旦对不上，症状是装配 TLS 时 panic：
    # expected ModuleMap because inline_key is empty —— 这句话完全不指向版本。
    # 撞上就这么办：换回已知能用的标签（如 :2.11.7），并确认证书还能签下来。
    #
    # 同一个作者的 ghcr.io/caddybuilds/caddy-cloudflare 已经拉不到（registry
    # 返回 denied），这里用 Docker Hub 上的同名镜像。
    image: caddybuilds/caddy-cloudflare:latest
    container_name: yvruc-caddy
    ports:
      - "80:80"      # 只用来把 http 跳成 https；占用不了就删掉这一行
      - "443:443"
    # YVRUC_DOMAIN 与 CF_API_TOKEN，见 caddy.env.example。文件可以不存在：CI 和
    # 只跑测试的机器上没有它，compose 照常加载其余服务；要起 caddy 时必须有。
    env_file:
      - path: caddy.env
        required: false
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与账户密钥必须持久化：不挂卷的话每次 up --build 都会重新签发一张，
      # 而 Let's Encrypt 对同一注册域限每周 50 张——调试期间重建几次就会被锁一周。
      - yvruc_caddy_data:/data
      - yvruc_caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: yvruc-cloudflared
    # 固定域名隧道，内测期间的第二个入口（另一个是 443 直连，见 caddy 服务）。
    # token 存于 .env 的 CLOUDFLARE_TOKEN（勿提交/外传）。
    # 官方镜像为 distroless（无 shell），故命令必须直接可执行、不能做条件分支。
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TOKEN}"]
    depends_on:
      - web
    restart: unless-stopped

  # 一次性任务：跑回归测试（用独立的 yvruc_test 库，不碰演示数据）
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      <<: *backend_build
      target: test
    image: yvruc-backend:test
    container_name: yvruc-tests
    environment:
      YVRUC_TEST_DATABASE_URL: postgresql+psycopg://yvruc:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/yvruc_test
      YVRUC_TEST_REDIS_URL: redis://redis:6379/1
      YVRUC_DEMO_PASSWORD: test-pass
      # 学校对接参数显式置空：不用 x-backend-env，也不让 .env 里的真实值漏进来，
      # 否则全量 pytest 会往学校网关、统一身份认证上打请求。tests/conftest.py
      # 导入 backend 之前还会再清一遍
      YVRUC_OPENPLATFORM_APPID: ""
      YVRUC_OPENPLATFORM_SECRET: ""
      YVRUC_OPENPLATFORM_GATEWAY: ""
      YVRUC_CAS_BASE_URL: ""
      YVRUC_SSO_REDIRECT_URI: ""
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  # 一次性任务：重置演示数据（不会随 up -d 启动）
  #   docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build: *backend_build
    image: yvruc-backend:local
    container_name: yvruc-seed
    environment: *backend_env
    entrypoint: ["python", "-X", "utf8", "-m", "backend.seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

networks:
  # 固定网段：web 容器里的 nginx 用它作为 set_real_ip_from 的信任范围
  # （YVRUC_TRUSTED_PROXY_CIDR，见上面的 web 服务）。换成别的网段时两处一起改。
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  yvruc_pgdata:
  yvruc_uploads:
  yvruc_materials:
  yvruc_tiles:
  yvruc_oplog:
  yvruc_caddy_data:
  yvruc_caddy_config:
