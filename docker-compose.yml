# 志愿服务管理平台 · Docker 全栈编排
#
#   cp .env.example .env && 填好口令                # 首次
#   docker compose up -d --build                    # 启动全套
#   docker compose --profile seed run --rm seed     # 重置演示数据
#   docker logs rucva-cloudflared --tail 20         # 查看隧道连接状态
#
# 服务拓扑：
#   web(nginx:8080) ──/api──▶ backend(uvicorn:8000) ──▶ postgres + redis
#   cloudflared：固定域名隧道，公网域名在 Cloudflare Zero Trust 控制台绑定。
#
# 数据库与 Redis 端口只绑 127.0.0.1：调试用得上，公网碰不到。
# 宿主机端口可在 .env 里改——同一台机器上别的项目也可能占着这些端口。
x-backend-build: &backend_build
  context: .
  dockerfile: backend/Dockerfile
  target: runtime

x-backend-env: &backend_env
  RUCVA_DATABASE_URL: postgresql+psycopg://rucva:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/rucva
  RUCVA_REDIS_URL: redis://redis:6379/0
  RUCVA_DEMO_PASSWORD: ${RUCVA_DEMO_PASSWORD:-}
  RUCVA_EXPOSE_DOCS: ${RUCVA_EXPOSE_DOCS:-}
  RUCVA_PUBLIC_BASE_URL: ${RUCVA_PUBLIC_BASE_URL:-}
  RUCVA_ID_CARD_KEY: ${RUCVA_ID_CARD_KEY:?请在 .env 设置 RUCVA_ID_CARD_KEY（见 .env.example）}
  # 学校开放平台（能力开放平台 / 统一认证）。留空 = 相关能力回落 Mock。
  # tests 服务**故意不注入**这几个变量：测试永远跑在 Mock 下，碰不到真实接口。
  RUCVA_OPENPLATFORM_APPID: ${RUCVA_OPENPLATFORM_APPID:-}
  RUCVA_OPENPLATFORM_SECRET: ${RUCVA_OPENPLATFORM_SECRET:-}
  RUCVA_OPENPLATFORM_GATEWAY: ${RUCVA_OPENPLATFORM_GATEWAY:-}
  RUCVA_CAS_BASE_URL: ${RUCVA_CAS_BASE_URL:-}
  RUCVA_SSO_REDIRECT_URI: ${RUCVA_SSO_REDIRECT_URI:-}
  # 天地图的浏览器端 tk（管理端画签到点用）。它本身会进前端，不是机密，
  # 但**得从后端转一手**：管理员在页面里换 key 时不用重新构建前端。
  # 注意这一份是逐个变量列出来的——往 .env 加了新变量，忘了在这儿加一行，
  # 容器里就当它不存在（表现为「地图不出来、也不报错」）。
  RUCVA_TIANDITU_TK: ${RUCVA_TIANDITU_TK:-}
  # 地名搜索用的**服务端** tk，与上面那把不是同一个应用，不能混用
  RUCVA_TIANDITU_TK_SERVER: ${RUCVA_TIANDITU_TK_SERVER:-}
  # 进程数与连接池。加进程是为了吃满多核（一个进程一个核，压测见
  # tests/perf_probe.py），但 Postgres 的连接是**按进程各开一个池**再相加的：
  # 进程数 ×(池子+溢出) 不能顶到 max_connections（默认 100），所以两个一起调。
  RUCVA_WORKERS: ${RUCVA_WORKERS:-4}
  RUCVA_DB_POOL_SIZE: ${RUCVA_DB_POOL_SIZE:-5}
  RUCVA_DB_MAX_OVERFLOW: ${RUCVA_DB_MAX_OVERFLOW:-10}
  # 场次锁在数据库里排队、各占一条连接：每进程最多放这么多个进去，
  # 要明显小于上面「池子+溢出」，否则抢报时读请求拿不到连接
  RUCVA_LOCK_SLOTS: ${RUCVA_LOCK_SLOTS:-5}
  RUCVA_THREADS: ${RUCVA_THREADS:-100}
  # 拿到名额闸门号的报名请求最多排多少秒场次锁（等不到回 503）
  RUCVA_TICKET_WAIT_SECONDS: ${RUCVA_TICKET_WAIT_SECONDS:-30}
  # 审批放着没人处理多少小时开始催（只催人，不自动通过）
  RUCVA_APPROVAL_REMIND_HOURS: ${RUCVA_APPROVAL_REMIND_HOURS:-24}
  # 设为 1 关掉后台定时任务（候补清扫、状态流转、提醒、日报）。生产别关
  RUCVA_DISABLE_SWEEPER: ${RUCVA_DISABLE_SWEEPER:-}
  TZ: Asia/Shanghai

services:
  postgres:
    image: postgres:16-alpine
    container_name: rucva-postgres
    environment:
      POSTGRES_USER: rucva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: rucva
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - rucva_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rucva -d rucva"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: rucva-redis
    # 名额闸门与限流计数都是可重建的瞬时状态，不做持久化
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: *backend_build
    image: rucva-backend:local
    container_name: rucva-backend
    environment: *backend_env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"   # 本机直连 API 调试用，公网只走 web 反代
    volumes:
      - rucva_uploads:/app/data/uploads   # 活动二维码等上传件持久化
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # web 的 depends_on 等的就是这个 healthy——没有它 nginx 会在后端还没起来时
      # 就开始转发，页面直接 502。所以探针留着，但起来之后没必要十秒一次地刷日志：
      # 启动期 2 秒一探（起得一样快），转成健康之后 30 秒一探。
      test: ["CMD", "python", "-c",
             "import urllib.request as u;u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 2s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: rucva-web
    ports:
      # 只绑本机：公网走 cloudflared 隧道，它在 compose 内网里直连 web:80。
      # 绑 0.0.0.0 等于把源站也摆到公网上，绕过隧道前面的防护。
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rucva-cloudflared
    # 固定域名隧道：token 存于 .env 的 CLOUDFLARE_TOKEN（勿提交/外传）。
    # 官方镜像为 distroless（无 shell），故命令必须直接可执行、不能做条件分支。
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TOKEN}"]
    depends_on:
      - web
    restart: unless-stopped

  # 一次性任务：跑回归测试（用独立的 rucva_test 库，不碰演示数据）
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      <<: *backend_build
      target: test
    image: rucva-backend:test
    container_name: rucva-tests
    environment:
      RUCVA_TEST_DATABASE_URL: postgresql+psycopg://rucva:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/rucva_test
      RUCVA_TEST_REDIS_URL: redis://redis:6379/1
      RUCVA_DEMO_PASSWORD: test-pass
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  # 一次性任务：重置演示数据（不会随 up -d 启动）
  #   docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build: *backend_build
    image: rucva-backend:local
    container_name: rucva-seed
    environment: *backend_env
    entrypoint: ["python", "-X", "utf8", "-m", "backend.seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  rucva_pgdata:
  rucva_uploads:
