# 校青协平台 · web 容器站点配置
# 静态资源本地托管，业务接口反代到 backend 容器（同源，无跨域问题）。

# 二维码要按「浏览器实际用的地址」拼出对外网址，所以协议不能被这一跳覆盖：
# cloudflared 到本容器之间是明文 http，$scheme 就是 http，直接写下去会让
# https 站点生成 http:// 的码。有上游传下来的就用上游的，没有才用 $scheme。
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 访问日志只记路径，不记查询串。下载票据一分钟即失效、用一次即作废，
# 但没有任何理由让它进日志——地址栏里出现过的东西，日志里能不留就不留。
log_format rucva '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/nginx/access.log rucva;

    # 二维码图片上传上限放宽
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # —— 业务 API（含媒体文件、二维码 SVG、Excel 导出流）——
    location /api/ {
        proxy_pass http://backend:8000;
        # $http_host 而不是 $host：后者不含端口，8080 这种非标端口会被丢掉，
        # 二维码兜底拼出来就是个少了端口、打不开的网址。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 120s;   # 自动排班求解留足时间
        proxy_buffering off;       # StreamingResponse 直接透传
    }

    # 带 content hash 的构建产物：永久缓存
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口页绝不缓存——防止发新版后浏览器拿旧 chunk 清单白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 构建号：页面隔一阵拉一次来判断自己是不是旧版，缓存了就永远发现不了
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # SPA 回退（当前为 hash 路由，兜底直链场景）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
