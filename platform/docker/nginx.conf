# 校青协平台 · web 容器站点配置
# 静态资源本地托管，业务接口反代到 backend 容器（同源，无跨域问题）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 二维码图片上传上限放宽
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # —— 业务 API（含媒体文件、二维码 SVG、Excel 导出流）——
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 自动排班求解留足时间
        proxy_buffering off;       # StreamingResponse 直接透传
    }

    # 接口文档（评审演示可用）
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }
    location = /docs         { proxy_pass http://backend:8000/docs; }
    location = /redoc        { proxy_pass http://backend:8000/redoc; }

    # 带 content hash 的构建产物：永久缓存
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口页绝不缓存——防止发新版后浏览器拿旧 chunk 清单白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 回退（当前为 hash 路由，兜底直链场景）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
