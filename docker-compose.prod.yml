# 生产形态：部署在学校虚机上，域名解析指过来、入向只放行 443。
#
#   docker compose -f docker-compose.yml -f docker-compose.school-db.yml \
#                  -f docker-compose.prod.yml up -d --build
#   或写进 .env：COMPOSE_FILE=docker-compose.yml;docker-compose.school-db.yml;docker-compose.prod.yml
#   （Linux/macOS 用冒号分隔，Windows 用分号）
#
# 三份文件各管一段，互不重复：
#   docker-compose.yml               公共部分（redis、migrate、backend、web、backup）
#   docker-compose.school-db.yml     连外部库：不起本机 postgres，migrate 不再等它
#   docker-compose.prod.yml（本文件）生产特有：证书、443、不起内测的两个入口
#
# 本文件只做三件事：
#   · 不起 caddy / cloudflared：域名直接解析到这台服务器，TLS 由 nginx 用学校证书终止
#   · web 换上 https 配置（web/nginx-https.conf.template），证书目录一起挂进去：
#     YVRUC_CERTS_DIR（默认仓库下 ./.certs）
#   · web 只开 443（校园网入向唯一放行的端口）
#
# 备份照 base 的 backup 服务：每天导出学校库 + 打包文件卷。学校不替我们备这个库，
# 数据库备份由我们负责；YVRUC_BACKUP_DB 跟随 .env（默认 1）。上线前先跑一次
# docker compose run --rm backup now，确认学校给的账户能完整导出。
#
# 上线前要填的值（.env 里）：
#   YVRUC_DATABASE_URL      学校统一库的连接串（含账户与口令，密码里的特殊字符要转义）
#   YVRUC_PUBLIC_BASE_URL   https://<学校给的域名>，如 https://volunteer.ruc.edu.cn
#   YVRUC_SITE_URL          同上
#   YVRUC_SSO_ENABLED=1     统一身份认证走真实接口（并在应用中心登记回调地址）
#   YVRUC_MSGCENTER_ENABLED=1
#   YVRUC_ID_CARD_KEY       身份证加密密钥（与数据库分开保管）
#   YVRUC_DEMO_PASSWORD     必须留空（演示登录在生产不存在）
#
# 证书：把学校发的 server.cer / server.key 放成
#   <YVRUC_CERTS_DIR>/fullchain.pem   站点证书 + 中间证书
#   <YVRUC_CERTS_DIR>/privkey.pem     私钥（权限 600）
# 换证书＝替换这两个文件 + docker exec yvruc-web nginx -s reload。
services:
  # base 里两个内测入口在这里都不起。caddy 只是内测的证书管家，生产由 nginx 自己
  # 用学校证书终止 TLS；隧道是内测的公网兜底，生产域名直接解析到服务器。
  caddy:
    profiles: ["intranet-disabled"]

  cloudflared:
    profiles: ["tunnel-disabled"]

  web:
    volumes:
      # 镜像默认是内测用的 http 80 那份；生产换成听 443、读证书的这份
      - ./web/nginx-https.conf.template:/etc/nginx/templates/default.conf.template:ro
      # 证书只读挂进来：容器里固定是 /etc/nginx/certs/{fullchain,privkey}.pem
      - ${YVRUC_CERTS_DIR:-./.certs}:/etc/nginx/certs:ro
    ports: !override
      # 入向唯一放行的端口。校园网防火墙在宿主机外面挡着其余端口，这里不做绑定限制。
      - "${HTTPS_HOST_PORT:-443}:443"
