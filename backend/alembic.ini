# Alembic 配置。数据库地址不写在这里，env.py 从 YVRUC_DATABASE_URL 读。
#
#   python -m backend.migrate                                   # 升到最新（部署用这条）
#   alembic -c backend/alembic.ini revision --autogenerate -m "说明"  # 改了模型后生成迁移
#   alembic -c backend/alembic.ini current                      # 库现在在哪一版
[alembic]
script_location = %(here)s/migrations
# 迁移文件按日期排序，一眼看出先后
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/..
path_separator = os
timezone = Asia/Shanghai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
