[project]
name = "rucommunity-tool-schedule"
version = "0.1.0"
description = "志愿者排班工具（RUCommunity 工具服务）"
requires-python = ">=3.11"
# 求解器本体零依赖（core.py 只用标准库）。下面这些都是「变成一个网页服务」
# 才需要的：接口、鉴权、数据库、表格读写。
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.116.0",
  # 向社区 API 换取身份要发内网 HTTP 请求。
  "httpx>=0.28.0",
  "openpyxl>=3.1.5",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  # 导出的 xlsx 里姓名要按拼音排。不能用 Python 默认的字符串序——那是按
  # Unicode 码点比，「张三」会排在「李四」前面（张 U+5F20 < 李 U+674E），
  # 打印出来发给经办人，看起来就是没排过。也不用 locale.strxfrm：slim 镜像里
  # 没装 zh_CN 语言包，装了也依赖运行环境，结果不可复现。
  "pypinyin>=0.53.0",
  # 上传岗位表/报名表走 multipart。
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
